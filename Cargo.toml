# Dependency-free safe Rust store-and-forward simulator by Jason Stys; field/function lines: docs/CODE_INDEX.md.
[package]
name = "delay-tolerant-mission-network-lab"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Jason Stys"]
license = "MIT"
[lib]
path = "rust/lib.rs"
[[bin]]
name = "network-core"
path = "rust/main.rs"
[profile.release]
overflow-checks = true
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "deny"
